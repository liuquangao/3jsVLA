<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#e8e3d8" />
    <link rel="icon" href="data:," />
    <title>3jsVLA — A1Z Data Collector</title>
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <a class="brand" href="#" aria-label="3jsVLA home">
          <span class="brand-mark">3</span>
          <span>3jsVLA</span>
        </a>
        <div class="topbar-meta">
          <span id="robot-badge">SIM</span>
          <span class="system-state"><i></i> LOCAL</span>
        </div>
      </header>

      <section class="workspace">
        <div class="stage-panel">
          <div id="scene" class="scene" aria-label="Three.js robot scene"></div>
          <div class="stage-label">
            <button class="camera-orbit" type="button" data-camera="orbit" aria-pressed="true">ORBIT</button>
            <span id="camera-view-label">DRAG TO ORBIT / SCROLL TO ZOOM</span>
          </div>
          <div id="recording-badge" class="recording-badge" hidden>
            <i></i> REC
          </div>
          <div class="axis-mark" aria-hidden="true">
            <span class="axis-y">Y</span>
            <span class="axis-x">X</span>
            <span class="axis-z">Z</span>
          </div>
          <nav class="camera-dock" aria-label="Live camera views">
            <button class="camera-tile" type="button" data-camera="wrist" aria-pressed="false">
              <canvas id="camera-wrist" aria-label="Live gripper camera"></canvas>
              <span>01 / GRIPPER <small>LIVE</small></span>
            </button>
            <button class="camera-tile" type="button" data-camera="overhead" aria-pressed="false">
              <canvas id="camera-overhead" aria-label="Live central forward-facing camera"></canvas>
              <span>02 / CENTER <small>LIVE</small></span>
            </button>
          </nav>
        </div>

        <aside class="control-panel">
          <section class="panel-section instruction-section">
            <div class="section-heading">
              <span>01</span>
              <h2>Task instruction</h2>
            </div>
            <label class="sr-only" for="instruction">Task instruction</label>
            <textarea id="instruction" rows="2"></textarea>
            <div class="task-row">
              <button id="new-task-button" class="text-button" type="button">New task</button>
              <span id="task-state" class="task-state">Not stacked</span>
            </div>
          </section>

          <section class="panel-section">
            <div class="section-heading">
              <span>02</span>
              <h2>Joint targets</h2>
            </div>
            <div id="joint-controls" class="joint-controls"></div>
            <button id="reset-button" class="text-button" type="button">Reset pose</button>
          </section>

          <section class="panel-section capture-section">
            <div class="section-heading">
              <span>03</span>
              <h2>Capture episode</h2>
            </div>
            <div class="capture-stats">
              <div><strong id="frame-count">000</strong><span>frames</span></div>
              <div><strong id="duration">00.0</strong><span>seconds</span></div>
              <div><strong>05</strong><span>Hz</span></div>
            </div>
            <div class="capture-actions">
              <button id="record-button" class="record-button" type="button"><i></i> Record</button>
              <button id="stop-button" class="secondary-button" type="button" disabled>Stop</button>
            </div>
            <div class="secondary-actions">
              <button id="replay-button" class="text-button" type="button" disabled>Replay</button>
              <button id="download-button" class="text-button" type="button" disabled>Download JSON</button>
            </div>

            <div class="generate-row">
              <label for="episode-count">Auto-generate</label>
              <input id="episode-count" type="number" min="1" max="500" step="1" value="20" />
              <button id="generate-button" class="secondary-button" type="button">Generate</button>
            </div>
            <div class="secondary-actions">
              <label for="generation-output">Output</label>
              <select id="generation-output" aria-label="Generation output">
                <option value="folder">Write to folder</option>
                <option value="download">Download JSON</option>
              </select>
            </div>
            <div class="secondary-actions">
              <button id="dataset-button" class="text-button" type="button" disabled>Download dataset</button>
            </div>
          </section>

          <section class="sensor-strip">
            <div>
              <span>OBSERVATION CAMERA</span>
              <small>256 × 192 / JPEG</small>
            </div>
            <img id="observation-preview" alt="Latest recorded observation" />
          </section>
        </aside>
      </section>

      <footer class="statusbar">
        <span id="status-message">READY — adjust a joint, then start recording</span>
        <span>3JSVLA COLLECTOR · EPISODE 001</span>
      </footer>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
