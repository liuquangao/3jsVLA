<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#e8e3d8" />
    <link rel="icon" href="data:," />
    <title>3jsVLA — A1Z Sandbox</title>
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <a class="brand" href="#" aria-label="3jsVLA home">
          <span class="brand-mark">3</span>
          <span>3jsVLA</span>
        </a>
        <div class="topbar-meta">
          <span id="robot-badge">SIM</span>
          <span class="system-state"><i></i> LOCAL</span>
        </div>
      </header>

      <section class="workspace">
        <section class="pick-stage">
          <div class="section-heading">
            <span>01</span>
            <h2>Pick a point</h2>
          </div>
          <div class="pick-images">
            <figure class="pick-image">
              <canvas id="view-top" width="640" height="480" aria-label="Top view, click the floor position"></canvas>
              <figcaption>TOP <small>click for X / Z</small></figcaption>
            </figure>
            <figure class="pick-image">
              <canvas id="view-side" width="640" height="480" aria-label="Side view, click the height"></canvas>
              <figcaption>SIDE <small>click for Y</small></figcaption>
            </figure>
            <figure class="pick-image is-context">
              <canvas id="view-context" width="640" height="480" aria-label="Centre camera, for reference"></canvas>
              <figcaption>CENTRE CAMERA <small>reference only</small></figcaption>
            </figure>
          </div>
        </section>

        <aside class="control-panel">
          <section class="panel-section">
            <div class="section-heading">
              <span>02</span>
              <h2>Target</h2>
            </div>
            <dl class="pick-readout">
              <div><dt>X</dt><dd id="pick-x">—</dd></div>
              <div><dt>Y</dt><dd id="pick-y">—</dd></div>
              <div><dt>Z</dt><dd id="pick-z">—</dd></div>
            </dl>
            <p class="readout-label">Gripper now</p>
            <dl class="pick-readout is-now">
              <div><dt>X</dt><dd id="gripper-x">—</dd></div>
              <div><dt>Y</dt><dd id="gripper-y">—</dd></div>
              <div><dt>Z</dt><dd id="gripper-z">—</dd></div>
            </dl>
            <div class="capture-actions">
              <button id="pick-move-button" class="record-button" type="button" disabled>Move gripper</button>
              <button id="pick-clear-button" class="secondary-button" type="button" disabled>Clear</button>
            </div>
            <p id="pick-state" class="pick-state">Click the same point in both camera views.</p>
          </section>

          <section class="panel-section">
            <div class="section-heading">
              <span>03</span>
              <h2>Jaws and scene</h2>
            </div>
            <div class="capture-actions">
              <button id="jaw-open-button" class="secondary-button" type="button">Open jaws</button>
              <button id="jaw-close-button" class="secondary-button" type="button">Close jaws</button>
            </div>
            <div class="secondary-actions">
              <button id="new-scene-button" class="text-button" type="button">New scene</button>
              <button id="reset-button" class="text-button" type="button">Reset pose</button>
            </div>
          </section>

        </aside>
      </section>

      <footer class="statusbar">
        <span id="status-message">READY — adjust a joint, then start recording</span>
        <span>3JSVLA COLLECTOR · EPISODE 001</span>
      </footer>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
